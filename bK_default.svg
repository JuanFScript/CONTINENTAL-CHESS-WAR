    <!-- Extra Large & Wide Royal Crown Dome / Semi-Sphere (Photo 2) -->
    <path d="M 8,23 C 8,14 14,9.5 22.5,9.5 C 31,9.5 37,14 37,23 Z" fill="#111827" />

    <!-- Crown Arches & Ribs Wrapping Dome (Extra Pompa) -->
