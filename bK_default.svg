<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 45" width="100%" height="100%">
  <g fill="none" fill-rule="evenodd" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
