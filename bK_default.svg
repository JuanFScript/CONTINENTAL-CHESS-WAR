    <path d="M 9.5,35.5 L 35.5,35.5 L 35.5,38 L 9.5,38 Z" fill="#111827" />
    <path d="M 8.5,38 L 36.5,38 L 36.5,40.5 L 8.5,40.5 Z" fill="#111827" />
