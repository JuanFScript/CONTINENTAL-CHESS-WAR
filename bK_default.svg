    <circle cx="14.5" cy="17" r="1.4" fill="#111827" stroke="#ffffff" />
    <circle cx="22.5" cy="15.5" r="1.4" fill="#111827" stroke="#ffffff" />
    <circle cx="30.5" cy="17" r="1.4" fill="#111827" stroke="#ffffff" />
    <circle cx="37" cy="19.5" r="1.4" fill="#111827" stroke="#ffffff" />

    <!-- Gemmed Headband / Crown Band -->
    <path d="M 7,23 L 38,23 L 38,27.5 L 7,27.5 Z" fill="#111827" />
    <!-- Gems (circles and diamond) -->
    <circle cx="11.5" cy="25.2" r="1.4" fill="#ffffff" stroke="none" />
    <circle cx="16.5" cy="25.2" r="1.1" fill="#ffffff" stroke="none" />
    <polygon points="22.5,23.7 24.2,25.2 22.5,26.7 20.8,25.2" fill="#ffffff" stroke="none" />
    <circle cx="28.5" cy="25.2" r="1.1" fill="#ffffff" stroke="none" />
    <circle cx="33.5" cy="25.2" r="1.4" fill="#ffffff" stroke="none" />

